<app-titulo [texto]="tituloPagina"></app-titulo>
<hr>
<div class="row align-items-center mb-2">
  <label class="col-auto col-form-label">Filtro:</label>

  <div class="col-3">
    <input
      type="text"
      class="form-control"
      placeholder="buscar"
      [(ngModel)]="filtroLista">
  </div>
</div>


<table class="table table-striped">
  <thead class="thead-dark">
    <tr>
      <th>
        <button class="btn btn-primary" (click)="alterarImagem()">
          <i class="{{ !exibirImagem ? 'fa fa-eye' : 'fa fa-eye-slash' }}"></i>
          {{ !exibirImagem ? 'exibir' : 'ocultar' }}
        </button>
      </th>
      <th>#</th>
      <th>Tema</th>
      <th>Local</th>
      <th>Data</th>
      <th>Qtd Pessoas</th>
      <th>Lote</th>
      <th>Opções</th>
    </tr>
  </thead>

  <tbody *ngIf="eventos && eventos.length">
    <tr *ngFor="let evento of eventosFiltrados">
    <td>
      <div
        class="collapse-container"
        [class.show]="exibirImagem">
        <img
          [src]="'assets/' + evento.imagemURL"
          alt="Evento"
          [style.width.px]="widthImg"
          [style.margin.px]="marginImg"
          class="img-fluid"
        >
      </div>
    </td>

      <td>{{ evento.id }}</td>
      <td>{{ evento.tema }}</td>
      <td>{{ evento.local }}</td>
      <td>{{ evento.dataEvento | DateTimeFormatPipe}}</td>
      <td>{{ evento.qtdPessoas }}</td>
      <td>{{ evento.lotes[0].nome }}</td>
      <td>
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-primary btn-sm">
            <i class="fa fa-edit"></i>
            Editar
          </button>

          <button
            type="button"
            class="btn btn-danger btn-sm"
            (click)="openModal(template)"
          >
            <i class="fa fa-trash"></i>
            Excluir
          </button>


        </div>
      </td>

    </tr>
  </tbody>

  <tfoot *ngIf="!eventos.length">
    <tr>
      <td colspan="8" class="text-center">
        <h4>Nenhum Evento encontrado</h4>
      </td>
    </tr>
  </tfoot>
</table>

<ng-template #template>
  <div class="modal-body text-center">
    <p>Tem certeza que quer deletar esse evento?</p>
    <button type="button" class="btn btn-default" (click)="confirm()" >Sim</button>
    <button type="button" class="btn btn-primary" (click)="decline()" >Não</button>
  </div>
</ng-template>
