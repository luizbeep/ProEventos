

<div class="card rounded shadow-sm p-5">
<div class="d-flex align-items-center mb-3 gap-2">

<label class="me-2 mb-0 fw-bold">Filtro:</label>

  <input
    type="text"
    class="form-control"
    placeholder="Filtrar por Tema ou Local"
    [(ngModel)]="filtroLista"
    style="max-width: 220px;"
  />

<a class="btn btn-outline-primary d-flex align-items-center ms-auto" [routerLink]="['../detalhe']">
  <i class="fa fa-plus-circle text-dark fa-2x"></i>
  <span class="d-none d-sm-inline-block fw-bold ms-2">Novo</span>
</a>





</div>




<table class="table table-striped">
  <thead class="thead-dark">
    <tr>
      <th class="d-none d-md-table-cell">
        <button class="btn btn-primary" (click)="alterarImagem()">
          <i class="{{ !exibirImagem ? 'fa fa-eye' : 'fa fa-eye-slash' }}"></i>
          {{ !exibirImagem ? 'exibir' : 'ocultar' }}
        </button>
      </th>
      <th>#</th>
      <th>Tema</th>
      <th class="d-none d-md-table-cell">Local</th>
      <th>Data</th>
      <th class="d-none d-md-table-cell">Qtd Pessoas</th>
      <th class="d-none d-md-table-cell">Lote</th>
      <th>Opções</th>
    </tr>
  </thead>

  <tbody *ngIf="eventos && eventos.length">
    <tr *ngFor="let evento of eventosFiltrados" (click)="detalheEvento(evento.id)" style="cursor: pointer;">
    <td class="d-none d-md-table-cell">
      <div
        class="collapse-container"
        [class.show]="exibirImagem">
        <img
          [src]="'assets/' + evento.imagemURL"
          alt="Evento"
          [style.width.px]="widthImg"
          [style.margin.px]="marginImg"
          class="img-fluid"
        >
      </div>
    </td>

      <td>{{ evento.id }}</td>
      <td>{{ evento.tema }}</td>
      <td class="d-none d-md-table-cell">{{ evento.local }}</td>
      <td>{{ evento.dataEvento | DateTimeFormatPipe}}</td>
      <td class="d-none d-md-table-cell">{{ evento.qtdPessoas }}</td>
      <td class="d-none d-md-table-cell">{{ evento.lotes[0].nome }}</td>
<td>
  <div class="d-flex flex-column flex-md-row align-items-center gap-2">


    <button type="button" class="btn btn-danger btn-lg d-flex align-items-center"
            (click)="openModal(template)">
      <i class="fa fa-trash"></i>
      <span class="d-none d-md-inline ms-1">Excluir</span>
    </button>
  </div>
</td>


    </tr>
  </tbody>

  <tfoot *ngIf="!eventos.length">
    <tr>
      <td colspan="8" class="text-center">
        <h4>Nenhum Evento encontrado</h4>
      </td>
    </tr>
  </tfoot>
</table>
</div>

<ng-template #template>
  <div class="modal-body text-center">
    <p>Tem certeza que quer deletar esse evento?</p>
    <button type="button" class="btn btn-default" (click)="confirm()" >Sim</button>
    <button type="button" class="btn btn-primary" (click)="decline()" >Não</button>
  </div>
</ng-template>
