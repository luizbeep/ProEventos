<nav class="navbar navbar-expand-lg navbar-light bg-primary shadow-sm" *ngIf="showMenu()">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/home"><i class="fa fa-music logo-icon"></i></a>

    <button class="navbar-toggler" type="button" (click)="isCollapsed = !isCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [collapse]="isCollapsed" [isAnimated]="true">

    <ul class="navbar-nav me-auto">
      <ng-container *ngIf="(accountService.currentUser$ | async) !== null">
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="/eventos">Eventos</a>
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="/dashboard">Dashboard</a>
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="/artistas">Artistas</a>
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="/contatos">Contatos</a>
        </li>
      </ng-container>
    </ul>

      <div class="d-flex align-items-center">
        <div *ngIf="(accountService.currentUser$ | async) == null" class="navbar-nav d-xs-none d-none d-md-block me-3">
          <a class="btn btn-light me-2" routerLink="/user/login">Entrar</a>
          <a class="btn btn-warning" routerLink="/user/registration">Me Cadastrar</a>
        </div>

        <ul *ngIf="(accountService.currentUser$ | async) !== null" class="navbar-nav">
          <li class="nav-item dropdown" dropdown *ngIf="(accountService.currentUser$ | async) as user">
            <a dropdownToggle class="nav-link dropdown-toggle text-black" style="cursor: pointer;">
              {{user.userName | titlecase}}
            </a>
            <div *dropdownMenu class="dropdown-menu dropdown-menu-end">
              <a class="dropdown-item" routerLink="user/perfil">Perfil</a>
              <div role="separator" class="divider"></div>
              <a (click)="logout()" class="dropdown-item" style="cursor:pointer;">Sair</a>
            </div>
          </li>
        </ul>
      </div>

    </div>
  </div>
</nav>
